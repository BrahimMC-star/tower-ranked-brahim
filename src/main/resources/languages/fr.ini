particle.freezing.lakes.name=&r&3Flocons Givrants
particle.freezing.lakes.lore=&r&fDes &bflocons de neige&f tournent lentement autour du{LINE}joueur avant de &bdisparaître&f en une &bbrume blanche&f.
particle.emerald.spiral.name=&r&aÉmeraude
particle.emerald.spiral.lore=&r&fDes particules &avertes&f en forme d'étoiles montent en{LINE}spirale du sol vers la tête du joueur.
particle.void.purple.name=&r&5Néant Pourpre
particle.void.purple.lore=&r&fDes éclats &5violets&f apparaissent par impulsion autour du{LINE}corps, accompagnés de petites &8explosions sombres&f.
particle.dancing.flame.name=&r&6Flamme Dansante
particle.dancing.flame.lore=&r&fDes &6flammes orangées&f se déplacent autour du joueur,{LINE}formant un cercle animé qui &epulse&f régulièrement.
particle.static.shock.name=&r&9Éclairs Statique
particle.static.shock.lore=&r&fDe fines &9étincelles bleues&f apparaissent aléatoirement{LINE}autour du joueur, simulant des &9décharges électriques&f.
particle.celestial.aura.name=&r&eAura Céleste
particle.celestial.aura.lore=&r&fUn halo &edoré&f et &fblanc&f tourne lentement autour du joueur,{LINE}avec des particules &escintillantes&f montant vers le ciel.
particle.sakura.petals.name=&r&dPétales de Sakura
particle.sakura.petals.lore=&r&fDes &dpétales roses&f descendent doucement autour du joueur{LINE}avant de se dissiper &doucement&f au sol.
particle.spectral.smoke.name=&r&8Fumée Spectrale
particle.spectral.smoke.lore=&r&fDe la &8fumée grise&f et &5violette&f s'élève lentement du sol,{LINE}formant un &7voile mystique&f autour du joueur.
particle.chromatic.spiral.name=&r&dSpirale Chromatique
particle.chromatic.spiral.lore=&r&fUn flux de particules &dmulticolores&f tourne rapidement{LINE}autour du joueur en une &espirale ascendante&f.
particle.void.ashes.name=&r&4Cendres du Néant
particle.void.ashes.lore=&r&fDe petites particules &4rouges&f et &8noires&f tombent du haut du joueur,{LINE}comme de la &cpoussière brûlante&f.
particle.wind.dash.name=&r&7Coup de vent
particle.wind.dash.lore=&r&fUne explosion de &bwind charge &fsurgit autour du joueur{LINE}&florsqu'il effectue un &bdouble jump&f,{LINE}&fcréant une &braffale dynamique &fà chaque impulsion.
particle.mini.storm.name=&r&7Tempête Miniature
particle.mini.storm.lore=&r&fUn tourbillon de particules &fblanches &fet &7grises &ftourne autour du joueur,{LINE}&fcréant une &7micro-tornade en mouvement constant&f.{LINE}&fIdéale pour une sensation de &7puissance &fet de &bvent&f.
particle.frost.heart.name=&r&3Coeur de Givre
particle.frost.heart.lore=&r&fDe fines particules &3bleutées &fpulsent près du cœur du joueur,{LINE}&frappelant une &brespiration glaciale&f à chaque battement.{LINE}&fUn effet &3doux &fet &bapaisant &fpour les amoureux du froid.
particle.void.orbits.name=&r&9Orbites du Néant
particle.void.orbits.lore=&r&fTrois sphères &9sombres &forbitent lentement autour du joueur,{LINE}&flaissant une traînée &5violette &fet &8noire&f derrière elles.{LINE}&fUn effet &dplanétaire&f, unique et &5hypnotique&f.
particle.shadow.dust.name=&r&8Poussière d'Ombre
particle.shadow.dust.lore=&r&fDe très fines particules &8noires &fs'élèvent du sol{LINE}&favant de disparaître dans un petit &8nuage sombre&f.{LINE}&fUn rendu &7subtil&f, &8sobre &fet &7élégant&f.
particle.life.essence.name=&r&aEssence de la Vie
particle.life.essence.lore=&r&fDes particules &avertes &fet &6dorées &fs'animent autour du joueur,{LINE}&fcomme une &aénergie curative &fqui le protège.{LINE}&fParfait pour un effet &6“divin” &fou de &ahéros&f.
particle.love.rain.name=&r&dPluie d'Amour
particle.love.rain.lore=&r&fDe petits &dcoeurs roses &ftombent doucement autour du joueur{LINE}&favant de s'évaporer dans un léger &déclat scintillant&f.{LINE}&fIdéal pour les &dromantiques &fou les skins &dcute&f.
particle.dimensional.rift.name=&r&5Faille Dimensionnelle
particle.dimensional.rift.lore=&r&fDes particules &5violettes &fsurgissent et disparaissent en spirale autour du joueur,{LINE}&fcomme si une &dfaille &fs'ouvrait dans la réalité.{LINE}&fUn effet visuel &dmystique &fet &5puissant&f.
particle.comet.name=&r&bComète
particle.comet.lore=&r&fDe fines traînées lumineuses &fblanches &fet &dviolettes &ftraversent le joueur,{LINE}&ftelles des &bmétéores miniatures &fen plein vol.{LINE}&fUn rendu &bénergique &fet &dspectaculaire&f.
particle.marine.splash.name=&r&3Éclaboussures Marines
particle.marine.splash.lore=&r&fDe petites &3éclaboussures bleues &fapparaissent autour des pieds du joueur à chaque pas,{LINE}&fdonnant la sensation de marcher sur une &bsurface humide&f.{LINE}&fSimple, &brafraîchissant &fet très &3fluide&f.
particle.wandering.souls.name=&r&cÂmes Errantes
particle.wandering.souls.lore=&r&fDe discrètes silhouettes d'&9âmes bleutées &fs'élèvent lentement autour du joueur{LINE}&favant de disparaître dans de &bmurmures visuels&f.{LINE}&fUn effet &cterrifiant &fet &6très haut de gamme&f.
particle.demoniac.aura.name=&r&4Aura Démoniaque
particle.demoniac.aura.lore=&r&fUn &4rituel infernal &fprend forme autour du joueur,{LINE}&ftracé par des &5runes maudites &fet des &cailes déchues&f.{LINE}&fUne manifestation du &4Néant &fde &6très haut standing&f.
particle.monster.fame.name=&r&fMonster &4Fame &dULTRA
particle.monster.fame.lore=&r&fUne aura &4pop iconique &fentre griffe, robe et projecteurs,{LINE}&finspirée des plus grands shows de &dLady Gaga&f.{LINE}&fUne cosmétique de &6prestige scénique absolu&f.

cosmetic.arrow.quiver.name=&r&3Carquois Enneigé
cosmetic.arrow.quiver.lore=&r&fUn &3carquois léger&f décoré de &fplumes blanches&f,{LINE}&aprêt&f à accompagner un &aarcher agile&f.
cosmetic.bandolier.name=&r&3Bando Givré
